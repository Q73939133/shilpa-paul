<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shilpa Paul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Alex+Brush&family=Cormorant+Garamond:wght@500&family=Dancing+Script:wght@600&family=EB+Garamond&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Italianno&family=Josefin+Slab:wght@600&family=Kaushan+Script&family=Libre+Baskerville&family=Lora:wght@500&family=Merriweather:wght@700&family=Monsieur+La+Doulaise&family=Montserrat:wght@600&family=Mr+De+Haviland&family=Mrs+Saint+Delafield&family=Parisienne&family=Pinyon+Script&family=Playball&family=Playfair+Display:wght@600&family=Poppins:wght@600&family=Prata&family=Rouge+Script&family=Sacramento&family=Shadows+Into+Light&family=Tangerine:wght@700&family=Yesteryear&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#91A3B0;            /* cadet grey */
  --card:color-mix(in srgb,#91A3B0 86%,#000);
  --bg-tan:#D2B48C;        /* tan */
  --card-tan:color-mix(in srgb,#D2B48C 84%,#000);
  --slate:#3F5666;
  --espresso:#3A2A24;
  --cream:#F6EDE3;
  --melon:#FFB59E;
  --tan:#E6C9A0;
  --penny:#5E2F24;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--espresso);font-family:"Josefin Slab",serif;overflow:hidden;transition:background .45s ease}
body[data-tone="tan"]{background:var(--bg-tan)}

/* 3D extruded lettering */
.x{
  --d:color-mix(in srgb,var(--c) 45%,#000);
  color:var(--c);
  text-shadow:
    1px 1px 0 var(--d),2px 2px 0 var(--d),3px 3px 0 var(--d),
    4px 4px 0 var(--d),5px 5px 0 var(--d),6px 6px 0 var(--d),
    10px 14px 16px rgba(0,0,0,.3);
}
.x.deep{
  text-shadow:
    1px 1px 0 var(--d),2px 2px 0 var(--d),3px 3px 0 var(--d),4px 4px 0 var(--d),
    5px 5px 0 var(--d),6px 6px 0 var(--d),7px 7px 0 var(--d),8px 8px 0 var(--d),
    9px 9px 0 var(--d),10px 10px 0 var(--d),11px 11px 0 var(--d),12px 12px 0 var(--d),
    16px 22px 26px rgba(0,0,0,.32);
}

/* swipe track */
.track{
  height:100%;display:flex;align-items:center;gap:1.25rem;
  padding:0 calc((100vw - var(--w)) / 2);
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;outline:none;
}
.track::-webkit-scrollbar{display:none}
.track{--w:min(84vw,520px)}

.card{
  flex:0 0 var(--w);height:min(76svh,640px);
  scroll-snap-align:center;scroll-snap-stop:always;
  container-type:inline-size;
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border-radius:28px;transition:background .45s ease;
  box-shadow:0 24px 50px rgba(30,40,50,.28);
  overflow:hidden;text-align:center;
}
.card .n{display:block;line-height:1.05;font-size:calc(17cqw * var(--k,1))}
.card small{position:absolute;left:0;right:0;bottom:1.4rem;font-size:1.05rem;opacity:.75}

.card[data-tone="tan"]{background:var(--card-tan)}

/* first card: diagonal name with axis line */
.hero .tilt{position:relative;transform:rotate(-8deg);width:100%;padding:0 6%;text-align:left}
.hero .line{display:block;font-family:"Parisienne",cursive;font-size:25cqw;line-height:1.1;white-space:nowrap}
.hero .last{margin-left:34%;margin-top:-.1em}
.axis{position:absolute;left:0;top:50%;width:100%;height:36px;margin-top:-18px;overflow:visible;pointer-events:none}
.axis line{stroke:var(--espresso);stroke-width:2.5;stroke-dasharray:3 9;stroke-linecap:round}
.axis path{fill:none;stroke:var(--espresso);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;right:1.4rem;bottom:1.4rem;font-size:1.1rem;opacity:.8;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}

/* dashed outline card */
.outline svg{width:92%;height:auto;overflow:visible}
.outline text{font-family:"Allura",cursive;font-size:120px;fill:none;stroke:var(--cream);stroke-width:2.2;stroke-dasharray:8 7;stroke-linecap:round;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-30}}

@media (prefers-reduced-motion:reduce){
  .hint,.outline text{animation:none}
}
</style>
</head>
<body>

<main class="track" id="track" tabindex="0" aria-label="Shilpa Paul in different fonts. Swipe sideways.">

  <section class="card hero">
    <div class="tilt">
      <span class="line first x deep" style="--c:var(--cream)">Shilpa</span>
      <svg class="axis" viewBox="0 0 1000 36" preserveAspectRatio="none" aria-hidden="true">
        <line x1="40" y1="18" x2="960" y2="18"/>
        <path d="M62 6 L40 18 L62 30"/>
        <path d="M938 6 L960 18 L938 30"/>
      </svg>
      <span class="line last x deep" style="--c:var(--melon)">Paul</span>
    </div>
    <span class="hint">Swipe</span>
  </section>

  <section class="card outline" aria-label="Shilpa Paul in dashed outline">
    <svg viewBox="0 0 400 300" role="img" aria-label="Shilpa Paul">
      <text x="200" y="130" text-anchor="middle">Shilpa</text>
      <text x="200" y="250" text-anchor="middle">Paul</text>
    </svg>
    <small>Allura outline</small>
  </section>

</main>

<script>
(function(){
  // text colours that read well on each background
  var COLORS = {
    grey: ["var(--cream)","var(--espresso)","var(--melon)","var(--tan)","var(--penny)"],
    tan:  ["var(--espresso)","var(--penny)","var(--cream)","var(--slate)"]
  };
  // [font family, size multiplier]
  var FONTS = [
    ["Great Vibes",1.25],["Playfair Display",.9],["Pinyon Script",1.2],["Cormorant Garamond",1.05],
    ["Mrs Saint Delafield",1.6],["Montserrat",.75],["Alex Brush",1.2],["Lora",.9],
    ["Herr Von Muellerhoff",1.7],["Dancing Script",1],["Libre Baskerville",.72],["Mr De Haviland",1.55],
    ["Tangerine",1.5],["Prata",.9],["Sacramento",1.2],["EB Garamond",1.05],
    ["Allura",1.3],["Poppins",.72],["Italianno",1.35],["Merriweather",.72],
    ["Monsieur La Doulaise",1.35],["Josefin Slab",1.05],["Playball",1],["Kaushan Script",.9],
    ["Rouge Script",1.1],["Yesteryear",1.05],["Shadows Into Light",1.05],["Parisienne",1.1]
  ];

  var track = document.getElementById("track");
  FONTS.forEach(function(f, i){
    var c = document.createElement("section");
    c.className = "card";
    var tone = i % 2 === 0 ? "tan" : "grey";   // backgrounds alternate as you swipe
    c.dataset.tone = tone;
    var pal = COLORS[tone];
    ["Shilpa","Paul"].forEach(function(word){
      var n = document.createElement("span");
      n.className = "n x";
      n.textContent = word;
      n.style.fontFamily = '"' + f[0] + '", serif';
      n.style.setProperty("--c", pal[(Math.floor(i / 2) * 2 + Math.floor(i / 6)) % pal.length]);
      n.style.setProperty("--k", f[1]);
      c.appendChild(n);
    });
    var l = document.createElement("small");
    l.textContent = f[0];
    c.appendChild(l);
    track.appendChild(c);
  });

  // page background follows the card in view (grey or tan)
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) document.body.dataset.tone = en.target.dataset.tone || "grey";
    });
  }, {root: track, threshold: 0.6});
  track.querySelectorAll(".card").forEach(function(c){ io.observe(c); });

  // mouse wheel scrolls sideways on desktop
  track.addEventListener("wheel", function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      track.scrollBy({left: e.deltaY, behavior: "auto"});
      e.preventDefault();
    }
  }, {passive: false});
})();
</script>
</body>
</html>
